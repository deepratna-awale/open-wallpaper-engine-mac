name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the supported Xcode
        # Xcode 26.3 (macOS 26 SDK, which Liquid Glass needs), the oldest the project supports and
        # the one release builds with. The runner is macOS 26: actool on macOS 15 crashes compiling
        # the layered AppIcon.icon (its icon renderer needs macOS 26 frameworks).
        run: |
          X=/Applications/Xcode_26.3.app
          [[ -d $X ]] || X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          [[ -n "$X" && -d "$X" ]] || { echo "::error::no Xcode 26 on the runner"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Test the release scripts
        run: |
          set -euo pipefail
          bash Scripts/release/test-release-version.sh
          python3 Scripts/release/test_appcast.py
          python3 Scripts/test_steam_totp.py
          for f in Scripts/release/*.sh Scripts/*.sh; do bash -n "$f"; done

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenWallpaperEngine.xcodeproj \
            -scheme OpenWallpaperEngine \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Check for deployment target mismatches
        # A library built for a newer macOS than the app's deployment target links, and then
        # fails to load on that older macOS.
        run: |
          if grep -E "was built for newer (macOS|macosx) version" xcodebuild.log; then
            echo "::error::a linked library targets a newer macOS than the app"; exit 1
          fi

      - name: Check glslang and SPIRV-Cross for symbol clashes
        run: Scripts/check-toolchain-symbols.sh build/DerivedData

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  # The same suite with Wallpaper Engine's built-in assets, so the asset-gated tests run. The assets
  # come from the CI Steam account (docs/ci-assets.md), cached per WE build. A separate job so the
  # no-asset job above stays the fast PR signal; fork PRs get no secrets and skip it.
  asset-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 60
    env:
      WE_ASSETS: ${{ github.workspace }}/../we-assets
    steps:
      - uses: actions/checkout@v4

      - name: Use the supported Xcode
        run: |
          X=/Applications/Xcode_26.3.app
          [[ -d $X ]] || X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          [[ -n "$X" && -d "$X" ]] || { echo "::error::no Xcode 26 on the runner"; exit 1; }
          sudo xcode-select -s "$X"

      - name: Read the Wallpaper Engine build
        id: build
        run: |
          id=$(Scripts/fetch-we-assets.sh --build-id || true)
          echo "id=${id:-unknown-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"

      - name: Restore the assets
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WE_ASSETS }}
          key: we-assets-${{ steps.build.outputs.id }}
          restore-keys: we-assets-

      - name: Fetch the assets
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          OWE_CI_STEAM_USER: ${{ secrets.OWE_CI_STEAM_USER }}
          OWE_CI_STEAM_PASSWORD: ${{ secrets.OWE_CI_STEAM_PASSWORD }}
          OWE_CI_STEAM_SHARED_SECRET: ${{ secrets.OWE_CI_STEAM_SHARED_SECRET }}
          OWE_TOOLS_DIR: ${{ runner.temp }}/owe-tools
        run: Scripts/fetch-we-assets.sh "$WE_ASSETS"

      - name: Build and test with the assets
        # OWE_LIBRARY stays unset: the library-gated tests skip.
        env:
          TEST_RUNNER_OWE_ASSETS: ${{ env.WE_ASSETS }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenWallpaperEngine.xcodeproj \
            -scheme OpenWallpaperEngine \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload log
        # The log only; never the assets.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-assets
          path: xcodebuild.log
