name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository (and the Actions cache and artifacts, which need no token scope).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEBUILD_FLAGS: >-
    -project OpenWallpaperEngine.xcodeproj
    -scheme OpenWallpaperEngine
    -configuration Debug
    -destination platform=macOS
    -derivedDataPath build/DerivedData
    -clonedSourcePackagesDirPath build/SourcePackages
    CODE_SIGNING_ALLOWED=NO
    COMPILER_INDEX_STORE_ENABLE=NO
  # Tests over about a minute skip unless OWE_SLOW_TESTS=1; nightly.yml runs them.
  TEST_FLAGS: >-
    -parallel-testing-enabled YES
    -parallel-testing-worker-count 3
  # Timing and frame-timed render classes flake under three workers' CPU/GPU contention;
  # the parallel run skips them and a serial run follows.
  SERIAL_CLASSES: >-
    TimelineCostTests TimelineRenderTests ImageMaterialPrelightingTests SceneScriptRenderTests ParticleEmitterTimingTests ParticleSimulationPerformanceTests SceneFrameBenchmarkTests SceneDisplayOutputTests SceneHDRRenderTests SceneBloomRenderTests FramePacingTests ScenePostProcessTests SceneRendererPlacementTests SceneLayerAnalysisTests

jobs:
  # Builds the app and the test bundle once; both test jobs run that build without recompiling.
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: xcode
        uses: ./.github/actions/select-xcode

      - name: Restore the Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/SourcePackages
          key: spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenWallpaperEngine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Restore the build
        # An exact hit is a build of these very sources: it is used as is. A partial hit still
        # saves rebuilding the packages.
        id: dd
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/DerivedData
          key: dd-${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenWallpaperEngine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('OpenWallpaperEngine/**', 'OpenWallpaperEngineTests/**', 'OpenWallpaperEngine.xcodeproj/**', 'OpenWallpaperEngine-Info.plist', 'Vendor/**') }}
          restore-keys: |
            dd-${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenWallpaperEngine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Build for testing
        if: steps.dd.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          xcodebuild build-for-testing $XCODEBUILD_FLAGS | tee xcodebuild.log

      - name: Check for deployment target mismatches
        # A library built for a newer macOS than the app's deployment target links, and then
        # fails to load on that older macOS.
        if: steps.dd.outputs.cache-hit != 'true'
        run: |
          if grep -E "was built for newer (macOS|macosx) version" xcodebuild.log; then
            echo "::error::a linked library targets a newer macOS than the app"; exit 1
          fi

      - name: Check glslang and SPIRV-Cross for symbol clashes
        run: Scripts/check-toolchain-symbols.sh build/DerivedData

      - name: Pack the test build
        run: tar -C build/DerivedData -czf products.tgz Build/Products

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: products
          path: products.tgz
          retention-days: 1
          compression-level: 0

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  build-and-test:
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/select-xcode

      - name: Test the release scripts
        run: |
          set -euo pipefail
          bash Scripts/release/test-release-version.sh
          python3 Scripts/release/test_appcast.py
          python3 Scripts/test_steam_totp.py
          for f in Scripts/release/*.sh Scripts/*.sh; do bash -n "$f"; done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: products

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build/DerivedData && tar -C build/DerivedData -xzf products.tgz
          XCTESTRUN="$(ls build/DerivedData/Build/Products/*.xctestrun | head -1)"
          SKIP=(); ONLY=()
          for c in $SERIAL_CLASSES; do SKIP+=(-skip-testing:OpenWallpaperEngineTests/$c); ONLY+=(-only-testing:OpenWallpaperEngineTests/$c); done
          xcodebuild test-without-building $TEST_FLAGS "${SKIP[@]}" \
            -xctestrun "$XCTESTRUN" -destination platform=macOS | tee xcodebuild.log
          xcodebuild test-without-building -parallel-testing-enabled NO "${ONLY[@]}" \
            -xctestrun "$XCTESTRUN" -destination platform=macOS | tee -a xcodebuild.log

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcodebuild-test-log
          path: xcodebuild.log

  # The same suite with Wallpaper Engine's built-in assets, so the asset-gated tests run. The assets
  # come from the CI Steam account (docs/ci-assets.md) and are downloaded fresh on every run; they
  # are never cached or uploaded. It runs on pushes to main and on manual runs from main only, never
  # for pull requests: the Steam secrets live in the steam-ci environment, which only main can use.
  # Contributors run the asset tests locally with OWE_ASSETS (CONTRIBUTING.md).
  asset-tests:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: steam-ci
    env:
      WE_ASSETS: ${{ github.workspace }}/../we-assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/select-xcode

      - name: Read the Wallpaper Engine build
        id: build
        run: |
          id=$(Scripts/fetch-we-assets.sh --build-id || true)
          [[ "$id" =~ ^[0-9]+$ ]] || id=unknown
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Wallpaper Engine build: $id" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the assets
        timeout-minutes: 20
        env:
          OWE_CI_STEAM_USER: ${{ secrets.OWE_CI_STEAM_USER }}
          OWE_CI_STEAM_PASSWORD: ${{ secrets.OWE_CI_STEAM_PASSWORD }}
          OWE_CI_STEAM_SHARED_SECRET: ${{ secrets.OWE_CI_STEAM_SHARED_SECRET }}
          OWE_TOOLS_DIR: ${{ runner.temp }}/owe-tools
        run: Scripts/fetch-we-assets.sh --force "$WE_ASSETS"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: products

      - name: Test with the assets
        # OWE_LIBRARY stays unset: the library-gated tests skip.
        env:
          TEST_RUNNER_OWE_ASSETS: ${{ env.WE_ASSETS }}
        run: |
          set -o pipefail
          mkdir -p build/DerivedData && tar -C build/DerivedData -xzf products.tgz
          XCTESTRUN="$(ls build/DerivedData/Build/Products/*.xctestrun | head -1)"
          SKIP=(); ONLY=()
          for c in $SERIAL_CLASSES; do SKIP+=(-skip-testing:OpenWallpaperEngineTests/$c); ONLY+=(-only-testing:OpenWallpaperEngineTests/$c); done
          xcodebuild test-without-building $TEST_FLAGS "${SKIP[@]}" \
            -xctestrun "$XCTESTRUN" -destination platform=macOS | tee xcodebuild.log
          xcodebuild test-without-building -parallel-testing-enabled NO "${ONLY[@]}" \
            -xctestrun "$XCTESTRUN" -destination platform=macOS | tee -a xcodebuild.log

      - name: Upload log
        # The log only; never the assets.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcodebuild-log-assets
          path: xcodebuild.log
