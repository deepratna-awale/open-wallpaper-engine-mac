name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the supported Xcode
        # Xcode 26.3 (macOS 26 SDK, which Liquid Glass needs), the oldest the project supports and
        # the one release builds with. The runner is macOS 26: actool on macOS 15 crashes compiling
        # the layered AppIcon.icon (its icon renderer needs macOS 26 frameworks).
        run: |
          X=/Applications/Xcode_26.3.app
          [[ -d $X ]] || X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          [[ -n "$X" && -d "$X" ]] || { echo "::error::no Xcode 26 on the runner"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenWallpaperEngine.xcodeproj \
            -scheme OpenWallpaperEngine \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Check for deployment target mismatches
        # A library built for a newer macOS than the app's deployment target links, and then
        # fails to load on that older macOS.
        run: |
          if grep -E "was built for newer (macOS|macosx) version" xcodebuild.log; then
            echo "::error::a linked library targets a newer macOS than the app"; exit 1
          fi

      - name: Check glslang and SPIRV-Cross for symbol clashes
        run: Scripts/check-toolchain-symbols.sh build/DerivedData

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
