name: CI

# CI runs twice per change: on its pull request once it's out of draft or labelled "ready to merge"
# (and up to date with main), and on main once it's merged. A draft without the label runs
# nothing; a push to a ready or labelled one runs again.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, labeled, synchronize, reopened]
  workflow_dispatch:

# Every job only reads the repository (and the Actions cache and artifacts, which need no token scope).
permissions:
  contents: read

# A run that won't test anything (an unlabelled draft, or another label added) gets a group
# of its own, so it never cancels a real run.
concurrency:
  group: >-
    ci-${{ github.ref }}-${{ (github.event_name != 'pull_request' ||
    (github.event.action == 'labeled' && github.event.label.name == 'ready to merge') ||
    (github.event.action != 'labeled' && (!github.event.pull_request.draft ||
    contains(github.event.pull_request.labels.*.name, 'ready to merge')))) && 'run' || github.run_id }}
  cancel-in-progress: true

env:
  XCODEBUILD_FLAGS: >-
    -project OpenWallpaperEngine.xcodeproj
    -scheme OpenWallpaperEngine
    -configuration Debug
    -destination platform=macOS
    -derivedDataPath build/DerivedData
    -clonedSourcePackagesDirPath build/SourcePackages
    CODE_SIGNING_ALLOWED=NO
    COMPILER_INDEX_STORE_ENABLE=NO
  # The slow tier (tests over about a minute, SlowTests.swift) skips unless OWE_SLOW_TESTS=1;
  # nightly.yml and Scripts/ci-local.sh run it. The test build is optimised
  # (Scripts/test-build-settings.txt) but stays a Debug build: DEBUG code, signing and @testable
  # imports are as before.
  # Scripts/ci-test-plan.py lists the test classes and splits them into shards; .github/test-map.yml
  # holds the serial classes and what a pull request's changed files select.
  # Scripts/ci-run-tests.sh runs a shard (parallel classes, then serial ones, failures retried
  # once); Scripts/ci-local.sh runs the whole suite the same way locally.

# The macOS jobs run on the maintainer's Mac (a self-hosted runner labelled owe-mac) while the
# repository variable OWE_SELF_HOSTED_MAC is 'true', for pushes, schedules, manual runs and pull
# requests from this repository's own branches; pull requests from forks always run on GitHub's
# macos-26 runners, so no outside code runs on that Mac (docs/self-hosted-runner.md).

jobs:
  # Lets a pull request through only out of draft or with the "ready to merge" label, and only
  # when it has every commit on main, so what is tested is what merges.
  gate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ready to merge') ||
      (github.event.action != 'labeled' && (!github.event.pull_request.draft ||
      contains(github.event.pull_request.labels.*.name, 'ready to merge')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Up to date with main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_sha=$(gh api "repos/$REPO/commits/$BASE" --jq .sha)
          behind=$(gh api "repos/$REPO/compare/$base_sha...$HEAD_SHA" --jq .behind_by)
          if [[ "$behind" != 0 ]]; then
            echo "::error::The branch is $behind commit(s) behind $BASE. Merge $BASE into it and push."
            exit 1
          fi

  # Which test classes run: every one, except on a pull request, where the changed files pick them
  # through .github/test-map.yml.
  plan:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit, whose first parent is the base.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Pick the test classes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          selection=all
          if [[ "$EVENT" == pull_request ]]; then
            if [[ $(git rev-list --parents -n 1 HEAD | wc -w) -eq 3 ]]; then
              git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
              selection=$(python3 Scripts/ci-test-plan.py affected --files changed.txt)
            else
              echo "::warning::HEAD is not a merge commit; running every test class."
            fi
          fi
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          case "$selection" in
            all) summary="all" ;;
            none) summary="none; only files that need no tests changed" ;;
            *) summary="$(wc -w <<< "$selection" | tr -d ' '): $selection" ;;
          esac
          echo "Test classes: $summary" >> "$GITHUB_STEP_SUMMARY"

  # Builds the app and the test bundle once; every test shard runs that build without recompiling.
  # A build of the same sources from an earlier run is reused instead: the push to main after a
  # merge has the very sources its pull request built (the gate keeps a pull request up to date
  # with main), so main tests that build rather than spending 20 minutes compiling it again. The
  # Actions cache can't carry it over, as main can't read a pull request's cache; the products
  # artifact can.
  build:
    needs: gate
    runs-on: ${{ vars.OWE_SELF_HOSTED_MAC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "owe-mac"]') || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # to find and download another run's products
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
      run-id: ${{ steps.reuse.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: xcode
        uses: ./.github/actions/select-xcode

      # On the Mac, DerivedData and the packages stay between runs and the build is incremental:
      # the Actions cache and the products artifact are skipped there.
      - id: mac
        uses: ./.github/actions/mac-cache
        with:
          build: 'true'

      # The build's inputs: Xcode, the test build settings, the packages and every source. Two
      # builds with the same key are the same build.
      - name: Name the build
        id: name
        env:
          KEY: dd-opt-${{ steps.xcode.outputs.version }}-${{ hashFiles('Scripts/test-build-settings.txt') }}-${{ hashFiles('OpenWallpaperEngine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('OpenWallpaperEngine/**', 'OpenWallpaperEngineTests/**', 'OpenWallpaperEngine.xcodeproj/**', 'OpenWallpaperEngine-Info.plist', 'Vendor/**', 'Packages/**') }}
          PARTIAL: dd-opt-${{ steps.xcode.outputs.version }}-${{ hashFiles('Scripts/test-build-settings.txt') }}-${{ hashFiles('OpenWallpaperEngine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
        run: |
          {
            echo "key=$KEY"
            echo "partial=$PARTIAL"
            echo "artifact=products-$(printf %s "$KEY" | shasum -a 256 | cut -c1-32)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Swift packages
        if: steps.mac.outputs.local != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenWallpaperEngine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Restore the build
        # An exact hit is a build of these very sources: it is used as is. A partial hit still
        # saves rebuilding the packages.
        id: dd
        if: steps.mac.outputs.local != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          # dd-opt: optimised builds, keyed on their settings too, never mixed with unoptimised ones.
          key: ${{ steps.name.outputs.key }}
          restore-keys: |
            ${{ steps.name.outputs.partial }}

      - name: Find a build of these sources from another run
        # Only from runs of this repository's own branches: a fork's pull request could upload
        # anything under that name, and main's asset shards run the products with the steam-ci
        # secrets.
        id: reuse
        if: steps.dd.outputs.cache-hit != 'true' && steps.mac.outputs.local != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$REPO/actions/artifacts?name=$ARTIFACT&per_page=20" --jq \
            "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)][0].workflow_run.id // empty" \
            || true)
          if [[ -n "$run_id" ]]; then
            echo "Reusing the build from run $run_id" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for testing
        if: steps.dd.outputs.cache-hit != 'true' && !steps.reuse.outputs.run-id
        run: |
          set -o pipefail
          read -ra OPTIMISE < Scripts/test-build-settings.txt
          # shellcheck disable=SC2086 # the flags split into words on purpose
          xcodebuild build-for-testing $XCODEBUILD_FLAGS "${OPTIMISE[@]}" | tee xcodebuild.log

      - name: Check for deployment target mismatches
        # A library built for a newer macOS than the app's deployment target links, and then
        # fails to load on that older macOS.
        if: steps.dd.outputs.cache-hit != 'true' && !steps.reuse.outputs.run-id
        run: |
          if grep -E "was built for newer (macOS|macosx) version" xcodebuild.log; then
            echo "::error::a linked library targets a newer macOS than the app"; exit 1
          fi

      # A reused build passed this check in the run that built it.
      - name: Check glslang and SPIRV-Cross for symbol clashes
        if: ${{ !steps.reuse.outputs.run-id }}
        run: Scripts/check-toolchain-symbols.sh build/DerivedData

      # On the Mac the shards read a clone of the products (APFS, so no copy) that the next run's
      # incremental build can't change under them. Clones over two days old are removed.
      - name: Keep the products for this run's tests
        if: steps.mac.outputs.local == 'true'
        env:
          ROOT: ${{ steps.mac.outputs.root }}
          PRODUCTS: ${{ steps.mac.outputs.products }}
        run: |
          set -euo pipefail
          find "$ROOT/products" -mindepth 1 -maxdepth 1 -mtime +2 -exec rm -rf {} +
          rm -rf "$PRODUCTS" && mkdir -p "$PRODUCTS"
          cp -cR build/DerivedData/Build/Products "$PRODUCTS/"

      - name: Pack the test build
        if: ${{ !steps.reuse.outputs.run-id && steps.mac.outputs.local != 'true' }}
        run: tar -C build/DerivedData -czf products.tgz Build/Products

      # Kept a week, so a pull request that merges days after its run still hands its build over.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !steps.reuse.outputs.run-id && steps.mac.outputs.local != 'true' }}
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: products.tgz
          retention-days: 7
          compression-level: 0

      - name: Save the build
        if: steps.dd.outputs.cache-hit != 'true' && !steps.reuse.outputs.run-id && steps.mac.outputs.local != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: ${{ steps.name.outputs.key }}

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  # The suite in three shards, split by test class. Each shard runs its parallel classes, then its
  # serial ones. On the Mac it's one shard: its one runner would only run three one after another.
  test:
    name: build-and-test (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [plan, build]
    if: needs.plan.outputs.selection != 'none'
    runs-on: ${{ vars.OWE_SELF_HOSTED_MAC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "owe-mac"]') || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # to download the products of the run the build reused
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.OWE_SELF_HOSTED_MAC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '[1]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: xcode
        uses: ./.github/actions/select-xcode

      - id: mac
        uses: ./.github/actions/mac-cache

      - name: Test the release scripts
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          bash Scripts/release/test-release-version.sh
          python3 Scripts/release/test_appcast.py
          python3 Scripts/test_steam_totp.py
          for f in Scripts/release/*.sh Scripts/*.sh; do bash -n "$f"; done

      # This run's build, or the earlier run's that it reused. On the Mac, the build job's clone.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.mac.outputs.local != 'true'
        with:
          name: ${{ needs.build.outputs.artifact }}
          run-id: ${{ needs.build.outputs.run-id }}
          github-token: ${{ needs.build.outputs.run-id && github.token || '' }}

      - name: Unpack the test build
        env:
          PRODUCTS: ${{ steps.mac.outputs.products }}
        run: |
          if [[ -n "$PRODUCTS" ]]; then
            [[ -d "$PRODUCTS/Products" ]] || { echo "::error::The build job's products are gone from $PRODUCTS; re-run the build."; exit 1; }
            runs=("$PRODUCTS"/Products/*.xctestrun)
          else
            mkdir -p build/DerivedData && tar -C build/DerivedData -xzf products.tgz
            runs=("$PWD"/build/DerivedData/Build/Products/*.xctestrun)
          fi
          echo "XCTESTRUN=${runs[0]}" >> "$GITHUB_ENV"
          python3 Scripts/ci-test-summary.py --env >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the shards cover every test class
        # -only-testing runs only the classes ci-test-plan.py finds; compare with the test bundle.
        if: matrix.shard == 1
        run: |
          mkdir -p build
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination platform=macOS \
            -enumerate-tests -test-enumeration-style flat -test-enumeration-format json \
            -test-enumeration-output-path build/enumeration.json > build/enumeration.log 2>&1 \
            || { tail -40 build/enumeration.log; exit 1; }
          python3 Scripts/ci-test-plan.py check --enumeration build/enumeration.json

      # Only the fixtures' shaders (the project's own) are translated here, so the cache is plain.
      # The Mac keeps its own between runs.
      - id: shadercache
        if: steps.mac.outputs.local != 'true'
        uses: ./.github/actions/shader-cache
        with:
          mode: restore
          xcode-version: ${{ steps.xcode.outputs.version }}

      - name: Test
        env:
          SELECTION: ${{ needs.plan.outputs.selection }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mkdir -p build
          python3 Scripts/ci-test-plan.py shard --index "$SHARD" --count "$SHARDS" --select "$SELECTION" > build/classes.txt
          echo "Shard $SHARD: $(wc -l < build/classes.txt | tr -d ' ') test classes" >> "$GITHUB_STEP_SUMMARY"
          Scripts/ci-run-tests.sh "$XCTESTRUN" build/classes.txt build/results

      - name: List the test durations
        if: ${{ !cancelled() }}
        run: |
          python3 Scripts/ci-test-durations.py --phases build/results/phases --csv build/durations.csv \
            build/results/parallel.xcresult build/results/serial.xcresult >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test durations
        if: ${{ !cancelled() && hashFiles('build/durations.csv') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-${{ matrix.shard }}
          path: build/durations.csv
          retention-days: 30

      # One shard saves, on main, what the run translated and compiled.
      - uses: ./.github/actions/shader-cache
        if: success() && matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mac.outputs.local != 'true'
        with:
          mode: save
          xcode-version: ${{ steps.xcode.outputs.version }}
          skip: ${{ steps.shadercache.outputs.hit }}

      - name: List the failing tests
        # Parallel runs print only "failed" per test; the result bundles hold the assertion text.
        # It goes to the log and the job summary.
        if: failure()
        run: python3 Scripts/ci-test-summary.py build/results/parallel.xcresult build/results/serial.xcresult | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: build/results
          retention-days: 7

  # The local packages' own tests (Packages/*), which the app's test bundle doesn't hold.
  packages:
    needs: gate
    runs-on: ${{ vars.OWE_SELF_HOSTED_MAC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "owe-mac"]') || 'macos-26' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: xcode
        uses: ./.github/actions/select-xcode

      - id: mac
        uses: ./.github/actions/mac-cache

      - name: Test the packages
        env:
          # On the Mac the packages' builds stay between runs.
          SCRATCH: ${{ steps.mac.outputs.root && format('{0}/packages', steps.mac.outputs.root) || 'build/packages' }}
        run: |
          set -o pipefail
          for package in Packages/*/; do
            swift test --package-path "$package" --scratch-path "$SCRATCH/$(basename "$package")"
          done

  # The required status check: passes only when the build, every shard and the packages passed (or
  # no test class had to run).
  build-and-test:
    needs: [gate, plan, build, test, packages]
    if: ${{ !cancelled() && needs.gate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the shards
        env:
          GATE: ${{ needs.gate.result }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          PACKAGES: ${{ needs.packages.result }}
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          echo "gate: $GATE, plan: $PLAN, build: $BUILD, shards: $TEST, packages: $PACKAGES"
          [[ "$GATE" == success && "$PLAN" == success && "$BUILD" == success && "$PACKAGES" == success ]] || exit 1
          [[ "$TEST" == success || ( "$TEST" == skipped && "$SELECTION" == none ) ]]

  # The same suite with Wallpaper Engine's built-in assets, so the asset-gated tests run. The assets
  # come from the CI Steam account (docs/ci-assets.md). They are cached only as an encrypted archive
  # whose key is in the steam-ci environment, and never uploaded. It runs on pushes to main and on
  # manual runs from main only, never for pull requests: the Steam secrets and the cache key live in
  # the steam-ci environment, which only main can use. It always runs every test class.
  # Contributors run the asset tests locally with OWE_ASSETS (CONTRIBUTING.md).
  #
  # asset-cache makes sure the encrypted cache holds the current build, so the four shards restore
  # it rather than each logging in to Steam.
  # It is the only job that logs in to Steam (with retries); the shards only restore, and fail
  # if they can't.
  asset-cache:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.OWE_SELF_HOSTED_MAC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "owe-mac"]') || 'macos-26' }}
    timeout-minutes: 40
    environment: steam-ci
    outputs:
      build-id: ${{ steps.assets.outputs.build-id }}
    env:
      WE_ASSETS: ${{ github.workspace }}/../we-assets
      WE_ASSETS_ENC: ${{ github.workspace }}/../we-assets.tar.enc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On the Mac with OWE_CI_ASSETS set, the shards use the Mac's assets: nothing to cache.
      - id: mac
        uses: ./.github/actions/mac-cache

      - id: assets
        if: ${{ !steps.mac.outputs.assets }}
        uses: ./.github/actions/we-assets
        with:
          cache-key: ${{ secrets.OWE_ASSET_CACHE_KEY }}
          steam-user: ${{ secrets.OWE_CI_STEAM_USER }}
          steam-password: ${{ secrets.OWE_CI_STEAM_PASSWORD }}
          steam-shared-secret: ${{ secrets.OWE_CI_STEAM_SHARED_SECRET }}
          save: 'true'
          prime: 'true'

  asset-test:
    name: asset-tests (${{ matrix.shard }}/4)
    needs: [build, asset-cache]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.OWE_SELF_HOSTED_MAC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "owe-mac"]') || 'macos-26' }}
    timeout-minutes: 60
    environment: steam-ci
    permissions:
      contents: read
      actions: read # to download the products of the run the build reused
    strategy:
      fail-fast: false
      matrix:
        # One shard on the Mac, as for the test job.
        shard: ${{ fromJSON(vars.OWE_SELF_HOSTED_MAC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '[1]' || '[1, 2, 3, 4]') }}
    env:
      WE_ASSETS: ${{ github.workspace }}/../we-assets
      WE_ASSETS_ENC: ${{ github.workspace }}/../we-assets.tar.enc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: xcode
        uses: ./.github/actions/select-xcode

      - id: mac
        uses: ./.github/actions/mac-cache

      # Restore only, the build asset-cache saved: the shards never log in to Steam. The Mac's own
      # assets need no restore.
      - if: ${{ !steps.mac.outputs.assets }}
        uses: ./.github/actions/we-assets
        with:
          cache-key: ${{ secrets.OWE_ASSET_CACHE_KEY }}
          build-id: ${{ needs.asset-cache.outputs.build-id }}
          download: 'false'

      # This run's build, or the earlier run's that it reused. On the Mac, the build job's clone.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.mac.outputs.local != 'true'
        with:
          name: ${{ needs.build.outputs.artifact }}
          run-id: ${{ needs.build.outputs.run-id }}
          github-token: ${{ needs.build.outputs.run-id && github.token || '' }}

      - name: Unpack the test build
        env:
          PRODUCTS: ${{ steps.mac.outputs.products }}
        run: |
          if [[ -n "$PRODUCTS" ]]; then
            [[ -d "$PRODUCTS/Products" ]] || { echo "::error::The build job's products are gone from $PRODUCTS; re-run the build."; exit 1; }
            runs=("$PRODUCTS"/Products/*.xctestrun)
          else
            mkdir -p build/DerivedData && tar -C build/DerivedData -xzf products.tgz
            runs=("$PWD"/build/DerivedData/Build/Products/*.xctestrun)
          fi
          echo "XCTESTRUN=${runs[0]}" >> "$GITHUB_ENV"
          python3 Scripts/ci-test-summary.py --env >> "$GITHUB_STEP_SUMMARY"

      # Encrypted: here the cache holds MSL translated from Wallpaper Engine's shaders. The Mac
      # keeps its own between runs.
      - id: shadercache
        if: steps.mac.outputs.local != 'true'
        uses: ./.github/actions/shader-cache
        with:
          mode: restore
          xcode-version: ${{ steps.xcode.outputs.version }}
          encryption-key: ${{ secrets.OWE_ASSET_CACHE_KEY }}

      - name: Test with the assets
        # OWE_LIBRARY stays unset: the library-gated tests skip.
        env:
          TEST_RUNNER_OWE_ASSETS: ${{ steps.mac.outputs.assets || env.WE_ASSETS }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mkdir -p build
          python3 Scripts/ci-test-plan.py shard --index "$SHARD" --count "$SHARDS" --select all > build/classes.txt
          echo "Shard $SHARD: $(wc -l < build/classes.txt | tr -d ' ') test classes" >> "$GITHUB_STEP_SUMMARY"
          Scripts/ci-run-tests.sh "$XCTESTRUN" build/classes.txt build/results

      - name: List the test durations
        if: ${{ !cancelled() }}
        run: |
          python3 Scripts/ci-test-durations.py --phases build/results/phases --csv build/durations.csv \
            build/results/parallel.xcresult build/results/serial.xcresult >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test durations
        # Test names and times only.
        if: ${{ !cancelled() && hashFiles('build/durations.csv') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-assets-${{ matrix.shard }}
          path: build/durations.csv
          retention-days: 30

      - uses: ./.github/actions/shader-cache
        if: success() && matrix.shard == 1 && steps.mac.outputs.local != 'true'
        with:
          mode: save
          xcode-version: ${{ steps.xcode.outputs.version }}
          encryption-key: ${{ secrets.OWE_ASSET_CACHE_KEY }}
          skip: ${{ steps.shadercache.outputs.hit }}

      - name: List the failing tests
        # To the log and the job summary.
        if: failure()
        run: python3 Scripts/ci-test-summary.py build/results/parallel.xcresult build/results/serial.xcresult | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        # The log and the result bundles only; never the assets.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-assets-${{ matrix.shard }}
          path: build/results
          retention-days: 7

  # Passes only when every asset shard passed.
  asset-tests:
    needs: [asset-cache, asset-test]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the shards
        env:
          CACHE: ${{ needs.asset-cache.result }}
          TEST: ${{ needs.asset-test.result }}
        run: |
          echo "asset cache: $CACHE, shards: $TEST"
          [[ "$CACHE" == success && "$TEST" == success ]]
