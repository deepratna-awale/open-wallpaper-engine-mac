name: Nightly

# The whole suite, slow tests included (OWE_SLOW_TESTS=1), with the WE assets.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    runs-on: macos-26
    timeout-minutes: 120
    # The Steam secrets live in this environment, which only main can use.
    environment: steam-ci
    env:
      WE_ASSETS: ${{ github.workspace }}/../we-assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/select-xcode

      - name: Read the Wallpaper Engine build
        id: build
        run: |
          id=$(Scripts/fetch-we-assets.sh --build-id || true)
          [[ "$id" =~ ^[0-9]+$ ]] || id=unknown
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Wallpaper Engine build: $id" >> "$GITHUB_STEP_SUMMARY"

      # Downloaded fresh on every run; the assets are never cached or uploaded.
      - name: Fetch the assets
        timeout-minutes: 20
        env:
          OWE_CI_STEAM_USER: ${{ secrets.OWE_CI_STEAM_USER }}
          OWE_CI_STEAM_PASSWORD: ${{ secrets.OWE_CI_STEAM_PASSWORD }}
          OWE_CI_STEAM_SHARED_SECRET: ${{ secrets.OWE_CI_STEAM_SHARED_SECRET }}
          OWE_TOOLS_DIR: ${{ runner.temp }}/owe-tools
        run: Scripts/fetch-we-assets.sh --force "$WE_ASSETS"

      - name: Build and test, slow tests included
        env:
          TEST_RUNNER_OWE_ASSETS: ${{ env.WE_ASSETS }}
          TEST_RUNNER_OWE_SLOW_TESTS: '1'
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenWallpaperEngine.xcodeproj \
            -scheme OpenWallpaperEngine \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log-nightly
          path: xcodebuild.log
