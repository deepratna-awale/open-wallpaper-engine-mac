# Wallpaper Engine asset tests for a pull request from someone else, run by hand after review.
#
# CI's own asset jobs run only on main: they need OWE_ASSET_CACHE_KEY, which GitHub doesn't give
# to pull_request runs from forks or bots. This workflow runs a PR's tests with the assets without
# pull_request_target:
#   - Only someone with write access can start it (Actions › Asset tests (PR) › Run workflow).
#   - The build job checks out the PR's code with no secrets and no credentials, builds it and
#     lists its test classes.
#   - The test jobs run in the asset-tests-pr environment, which waits for the maintainer's
#     approval and holds only OWE_ASSET_CACHE_KEY (never the Steam account): they restore the
#     existing encrypted asset cache and never fill or save it. Their actions and scripts are
#     main's, not the PR's.
# Review the PR's diff before approving: its tests run with the assets on disk.
name: Asset tests (PR)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (review its diff first)
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: asset-tests-pr-${{ inputs.pr }}
  cancel-in-progress: true

env:
  XCODEBUILD_FLAGS: >-
    -project OpenWallpaperEngine.xcodeproj
    -scheme OpenWallpaperEngine
    -configuration Debug
    -destination platform=macOS
    -derivedDataPath build/DerivedData
    -clonedSourcePackagesDirPath build/SourcePackages
    CODE_SIGNING_ALLOWED=NO
    COMPILER_INDEX_STORE_ENABLE=NO

jobs:
  build:
    # No environment, no secrets: the PR's code only builds here.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        uses: ./.github/actions/select-xcode

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          path: pr
          persist-credentials: false

      - name: Build the PR for testing
        working-directory: pr
        run: |
          set -o pipefail
          read -ra OPTIMISE < Scripts/test-build-settings.txt
          # shellcheck disable=SC2086 # the flags split into words on purpose
          xcodebuild build-for-testing $XCODEBUILD_FLAGS "${OPTIMISE[@]}" | tail -n 200

      - name: List the PR's test classes per shard
        # Its own tests, so classes the PR adds run too; the lists are plain text.
        working-directory: pr
        run: |
          mkdir -p ../plan
          for shard in 1 2 3 4; do
            python3 Scripts/ci-test-plan.py shard --index "$shard" --count 4 --select all > "../plan/classes-$shard.txt"
          done
          wc -l ../plan/*.txt

      - name: Pack the test build
        run: tar -C pr/build/DerivedData -czf products.tgz Build/Products

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-products
          path: |
            products.tgz
            plan/
          retention-days: 1

  test:
    name: asset-tests (${{ matrix.shard }}/4)
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    # Waits for the maintainer's approval; holds OWE_ASSET_CACHE_KEY only.
    environment: asset-tests-pr
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      WE_ASSETS: ${{ github.workspace }}/../we-assets
      WE_ASSETS_ENC: ${{ github.workspace }}/../we-assets.tar.enc
    steps:
      # main's actions and scripts only; the PR's code arrives as the built test bundle.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # Restore only: no Steam login, nothing saved.
      - uses: ./.github/actions/we-assets
        with:
          cache-key: ${{ secrets.OWE_ASSET_CACHE_KEY }}
          download: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-products

      - name: Unpack the test build
        run: |
          mkdir -p build/DerivedData && tar -C build/DerivedData -xzf products.tgz
          runs=("$PWD"/build/DerivedData/Build/Products/*.xctestrun)
          echo "XCTESTRUN=${runs[0]}" >> "$GITHUB_ENV"

      - name: Test with the assets
        # OWE_LIBRARY stays unset: the library-gated tests skip.
        env:
          TEST_RUNNER_OWE_ASSETS: ${{ env.WE_ASSETS }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "PR #${{ inputs.pr }}, shard $SHARD: $(wc -l < "plan/classes-$SHARD.txt" | tr -d ' ') test classes" >> "$GITHUB_STEP_SUMMARY"
          Scripts/ci-run-tests.sh "$XCTESTRUN" "plan/classes-$SHARD.txt" build/results

      - name: List the failing tests
        if: failure()
        run: python3 Scripts/ci-test-summary.py build/results/parallel.xcresult build/results/serial.xcresult | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        # The result bundles only; never the assets.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-test-results-${{ matrix.shard }}
          path: build/results
          retention-days: 7
