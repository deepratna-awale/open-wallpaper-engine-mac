# Research build for the Steam QR sign-in work: a SteamKit2 probe and DepotDownloader with a
# refresh-token patch, for osx-arm64. Runs only on the research branch; not part of CI.
# Built on Linux because macOS runners queue for a long time; the SDK can't sign there, so the
# binaries need `codesign -s -` on the Mac before they run.
name: Steam helper probe

on:
  push:
    branches: [steam-qr-signin-research]
    paths: ['SteamHelper/**', 'Vendor/DepotDownloader/**', '.github/workflows/steam-helper-probe.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
      - name: Probe
        run: |
          dotnet publish SteamHelper/Probe/SteamProbe.csproj -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true -p:DebugType=embedded -o out
      - name: DepotDownloader 3.4.0 with the refresh-token patch
        run: |
          git clone --depth 1 --branch DepotDownloader_3.4.0 https://github.com/SteamRE/DepotDownloader.git dd
          git -C dd apply "$GITHUB_WORKSPACE/SteamHelper/Probe/depotdownloader-refresh-token.patch"
          dotnet publish dd/DepotDownloader/DepotDownloader.csproj -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true -p:DebugType=embedded -o out
      - name: Helper
        run: |
          dotnet publish SteamHelper/OWESteamHelper.csproj -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true -p:DebugType=embedded -o out
          cp SteamHelper/smoke-test.py SteamHelper/smoke-test-qr.swift out/
      - run: ls -la out && sha256sum out/SteamProbe out/DepotDownloader
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-helper-probe-osx-arm64
          path: |
            out/SteamProbe
            out/DepotDownloader
            out/owe-steam-helper
            out/smoke-test.py
            out/smoke-test-qr.swift
          retention-days: 7
