name: Use the Mac's own caches
description: >-
  On the self-hosted Mac (docs/self-hosted-runner.md), points build/DerivedData and
  build/SourcePackages at folders that outlive the job, so xcodebuild builds incrementally, and
  hands over the WE assets already on the Mac (OWE_CI_ASSETS in the runner's .env). The callers
  then skip the Actions cache, the products artifact and the Steam download. On GitHub's runners
  it does nothing and outputs local=false.
inputs:
  build:
    description: "'true' links build/DerivedData and build/SourcePackages to the Mac's folders"
    required: false
    default: 'false'
outputs:
  local:
    description: "'true' on the self-hosted Mac"
    value: ${{ steps.mac.outputs.local }}
  root:
    description: The folder that outlives the job (empty on GitHub's runners)
    value: ${{ steps.mac.outputs.root }}
  products:
    description: Where this run's build keeps its products for the run's test jobs
    value: ${{ steps.mac.outputs.products }}
  assets:
    description: The Mac's WE assets folder, or empty when OWE_CI_ASSETS isn't set or holds none
    value: ${{ steps.mac.outputs.assets }}
runs:
  using: composite
  steps:
    - id: mac
      shell: bash
      env:
        SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
        BUILD: ${{ inputs.build }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        if [[ "$SELF_HOSTED" != true ]]; then
          echo "local=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Next to the checkouts in the runner's _work folder, on the external drive. One runner
        # runs one job at a time, so nothing else writes here while a job runs.
        root="$(cd "$RUNNER_WORKSPACE/.." && pwd)/_owe-cache"
        mkdir -p "$root/DerivedData" "$root/SourcePackages" "$root/products" "$root/packages"
        if [[ "$BUILD" == true ]]; then
          mkdir -p build
          rm -rf build/DerivedData build/SourcePackages
          ln -s "$root/DerivedData" build/DerivedData
          ln -s "$root/SourcePackages" build/SourcePackages
        fi
        # A cancelled job leaves its test processes (ci-run-tests.sh, xcodebuild, the test hosts)
        # running: they take the CPU and the shared isolated-tests folders from this job. Each one
        # names its run's products folder, so only another run's CI test processes match.
        for pid in $(pgrep -f "$root/products/" || true); do
          ps -o args= -p "$pid" 2>/dev/null | grep -q "$root/products/$RUN_ID/" || kill "$pid" 2>/dev/null || true
        done
        # One test host at a time on the maintainer's Mac (Scripts/ci-run-tests.sh), not three.
        echo "OWE_TEST_WORKERS=1" >> "$GITHUB_ENV"
        assets=${OWE_CI_ASSETS:-}
        if [[ -n "$assets" && ! -d "$assets/assets/shaders" ]]; then
          echo "::warning::OWE_CI_ASSETS ($assets) holds no assets/shaders; using the asset cache instead."
          assets=
        fi
        {
          echo "local=true"
          echo "root=$root"
          echo "products=$root/products/$RUN_ID"
          echo "assets=$assets"
        } >> "$GITHUB_OUTPUT"
